# 로컬 검증용 구성. DESIGN.md 13절 프로덕션 구성(브라우저 -> Caddy(HTTPS) ->
# Next.js(3000) -> FastAPI(8000))에서 Caddy 앞단은 제외했다 — 실제 도메인·TLS
# 발급은 이 환경에서 테스트 불가하다(Caddyfile은 별도 파일로 존재, `caddy
# validate`로만 검증). docker-compose는 app/frontend 두 컨테이너가 실제로
# 빌드·기동되고 서로 통신하는지까지만 확인한다.
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # 합성 DB·RAG 인덱스는 생성물이라 이미지에 굽지 않는다(entrypoint가
      # 컨테이너 시작 시 멱등하게 만든다) — 볼륨으로 재시작 간 유지한다.
      - shop_data:/app/data/synthetic
      - chroma_data:/app/chroma_db
    depends_on:
      - slack-mcp
      - notion-mcp

  # Phase 11 — Slack 에스컬레이션 알림 MCP 서버(MCP_INTEGRATION.md 8.2절,
  # zencoderai/slack-mcp 실측값). MCP_NOTIFIER=noop(기본값)이면 app이 이
  # 서비스를 전혀 호출하지 않는다.
  slack-mcp:
    image: zencoderai/slack-mcp:latest
    command: ["--transport", "http"]  # 없으면 stdio로 떠서 HTTP 호출 불가(실측)
    environment:
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_TEAM_ID: ${SLACK_TEAM_ID}
      AUTH_TOKEN: ${SLACK_MCP_TOKEN}  # 고정하지 않으면 기동마다 UUID 자동 생성(실측)
    # [엄수] ports를 열지 않는다 — 이 서버는 앞단 인증이 있긴 하지만(AUTH_TOKEN)
    # 도커 내부 네트워크에서만 접근 가능해야 한다(2중 방어, MCP_INTEGRATION.md 2절).
    expose:
      - "3000"

  # Phase 12c — 라이브 공지 조회 MCP 서버(MCP_INTEGRATION.md 2b절, 공식
  # makenotion/notion-mcp-server 실측값). NOTICE_SOURCE=noop(기본값)이면 app이
  # 이 서비스를 전혀 호출하지 않는다.
  notion-mcp:
    image: mcp/notion
    # 기본이 stdio라 --transport http가 없으면 HTTP 호출 불가. 기본 host가
    # 127.0.0.1이라 컨테이너 밖(도커 네트워크)에서 못 붙으므로 0.0.0.0으로 연다
    # (전부 실측 확인, 2026-07-31).
    command: ["--transport", "http", "--host", "0.0.0.0", "--port", "3000"]
    environment:
      # [실측] 공개 이미지(mcp/notion)는 NOTION_TOKEN env를 인식하지 못한다
      # (그 기능이 추가되기 전 빌드 — makenotion/notion-mcp-server#94).
      # OPENAPI_MCP_HEADERS로 우회한다.
      OPENAPI_MCP_HEADERS: '{"Authorization": "Bearer ${NOTION_TOKEN}", "Notion-Version": "2025-09-03"}'
      AUTH_TOKEN: ${NOTION_MCP_TOKEN}  # MCP 앞단 인증(우리 클라이언트가 Bearer로 보냄)
    # [엄수] slack-mcp와 같은 이유로 ports를 열지 않는다.
    expose:
      - "3000"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - FASTAPI_BASE_URL=http://app:8000
      - CS_API_KEY=${CS_API_KEY}
    depends_on:
      - app

volumes:
  shop_data:
  chroma_data:
